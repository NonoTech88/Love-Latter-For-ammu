<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter 💌</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ffd7e7,#f7b5d0,#ffddea);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
}

/* Envelope */
.envelope{
  position:relative;
  width:330px;
  height:220px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 18px 40px rgba(255,70,140,.22);
  cursor:pointer;
  transition:.5s;
}

.envelope:before{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:0;
  border-left:165px solid transparent;
  border-right:165px solid transparent;
  border-bottom:120px solid #f5f5f5;
  z-index:3;
}

.flap{
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:165px solid transparent;
  border-right:165px solid transparent;
  border-top:125px solid #eeeeee;
  transform-origin:top;
  transition:1s;
  z-index:5;
}

.heart{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  font-size:90px;
  opacity:0;
  z-index:2;
}

.envelope.open .flap{
  transform:rotateX(180deg);
  z-index:1;
}

.envelope.open .heart{
  opacity:1;
  animation:heartFly 2s forwards;
}

/* Main cute text */
.loveText{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,100px) scale(0);
  font-size:44px;
  font-weight:900;
  color:#ff2f7d;
  text-shadow:
    0 3px 0 #fff,
    0 6px 18px rgba(255,20,110,.35);
  opacity:0;
  white-space:nowrap;
  z-index:20;
  letter-spacing:.5px;
}

.loveText.show{
  animation:textFly 3.8s cubic-bezier(.2,.8,.2,1) forwards;
}

/* Cute little hearts around the text */
.cuteHeart{
  position:fixed;
  left:50%;
  top:50%;
  font-size:30px;
  z-index:19;
  pointer-events:none;
  animation:cuteFly 3.5s ease-out forwards;
}

/* Reset button */
.resetBtn{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  border:0;
  padding:12px 24px;
  border-radius:30px;
  background:#ff4f91;
  color:white;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(255,60,130,.25);
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:30;
}

.resetBtn.show{
  opacity:1;
  pointer-events:auto;
}

.resetBtn:active{
  transform:translateX(-50%) scale(.94);
}

/* Animations */
@keyframes heartFly{
  0%{
    transform:translate(-50%,-50%) scale(.5);
  }
  40%{
    transform:translate(-50%,-120%) scale(1.25);
  }
  100%{
    transform:translate(-50%,-250%) scale(.8);
    opacity:0;
  }
}

@keyframes textFly{
  0%{
    transform:translate(-50%,100px) scale(0);
    opacity:0;
  }
  22%{
    transform:translate(-50%,0) scale(1.18);
    opacity:1;
  }
  38%{
    transform:translate(-50%,0) scale(.96);
  }
  52%{
    transform:translate(-50%,0) scale(1.05);
  }
  72%{
    transform:translate(-50%,-65px) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(-50%,-210px) scale(.88);
    opacity:0;
  }
}

@keyframes cuteFly{
  0%{
    transform:translate(-50%,20px) scale(.2) rotate(0);
    opacity:0;
  }
  25%{
    opacity:1;
  }
  100%{
    transform:
      translate(calc(-50% + var(--x)),calc(-50% + var(--y)))
      rotate(var(--r))
      scale(1.2);
    opacity:0;
  }
}

@media(max-width:500px){
  .envelope{
    width:280px;
    height:190px;
  }

  .envelope:before{
    border-left-width:140px;
    border-right-width:140px;
    border-bottom-width:105px;
  }

  .flap{
    border-left-width:140px;
    border-right-width:140px;
    border-top-width:110px;
  }

  .loveText{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="envelope" id="envelope">
  <div class="flap"></div>
  <div class="heart">💗</div>
</div>

<div class="loveText" id="loveText">
  💕 Love you Ammu 💕
</div>

<button class="resetBtn" id="resetBtn">↻ Reset 💗</button>

<script>
const envelope = document.getElementById("envelope");
const loveText = document.getElementById("loveText");
const resetBtn = document.getElementById("resetBtn");

let opened = false;

envelope.addEventListener("click", () => {

  if(opened) return;
  opened = true;

  envelope.classList.add("open");

  setTimeout(() => {
    loveText.classList.add("show");
  }, 850);

  /* Lots of cute floating love emojis */
  const emojis = ["💗","💗","💗","💋","💋","💋","💋","💋","💋"];

  for(let i=0;i<24;i++){

    const heart = document.createElement("div");
    heart.className = "cuteHeart";
    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    const x = (Math.random()-.5)*650;
    const y = -Math.random()*550-80;
    const r = (Math.random()-.5)*90;

    heart.style.setProperty("--x",x+"px");
    heart.style.setProperty("--y",y+"px");
    heart.style.setProperty("--r",r+"deg");
    heart.style.fontSize = (20 + Math.random()*24) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(),3600);
  }

  setTimeout(() => {
    resetBtn.classList.add("show");
  }, 3000);
});

/* Reset */
resetBtn.addEventListener("click", () => {

  opened = false;

  envelope.classList.remove("open");
  loveText.classList.remove("show");
  resetBtn.classList.remove("show");

  document.querySelectorAll(".cuteHeart").forEach(h => h.remove());
});
</script>

</body>
</html>
